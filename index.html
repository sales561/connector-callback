<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Returning to Gmail Connector</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f4; color: #0a0a0a; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 440px; padding: 24px 16px; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0b0b0b; color: #f5f5f5; } }
</style>
</head>
<body>
<main><p id="msg">Returning to Gmail Connector on your computer…</p></main>
<script>
// Slack only sends sign-ins back to https pages, and Gmail Connector runs on your own
// computer (http://127.0.0.1). This page just hands Slack's reply to that app. The
// one-time code in it is useless without the app's secret, which never leaves your
// computer. Nothing is stored or sent anywhere else.
(function () {
  var q = new URLSearchParams(location.search);
  var port = (q.get("state") || "").split(".")[0];
  if (!/^\d{4,5}$/.test(port) || +port < 1024 || +port > 65535) {
    document.getElementById("msg").textContent = "This page only works when you click Connect Slack workspace in the Gmail Connector app.";
    return;
  }
  location.replace("http://127.0.0.1:" + port + "/slack/callback" + location.search);
})();
</script>
</body>
</html>
