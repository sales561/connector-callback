  <h1>Gmail Connector</h1>
  <p>A private, read-only tool that lets its owner read several of their own Gmail inboxes in one place on their own computer, and builds their daily inbox summary. It never sends, deletes or changes email.</p>
  <p>It is not a public service and doesn't take sign-ups.</p>
